{{ define "config_editor" }}
<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <div class="flex items-center justify-between mb-6 border-b pb-4">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">{{ .Title }} Configuration</h2>
            <p class="text-sm text-gray-500 mt-1">Edit the raw configuration file for {{ .Title }}.</p>
        </div>
        {{ if .Status }}
            <div>
                {{ if eq .Status "Running" }}
                    <span class="inline-flex items-center rounded-md bg-green-50 px-2.5 py-1.5 text-sm font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                        <svg class="w-2 h-2 mr-1.5 fill-green-500" viewBox="0 0 6 6" aria-hidden="true"><circle cx="3" cy="3" r="3" /></svg>
                        Running
                    </span>
                {{ else }}
                    <span class="inline-flex items-center rounded-md bg-gray-50 px-2.5 py-1.5 text-sm font-medium text-gray-600 ring-1 ring-inset ring-gray-500/10">
                        <svg class="w-2 h-2 mr-1.5 fill-gray-400" viewBox="0 0 6 6" aria-hidden="true"><circle cx="3" cy="3" r="3" /></svg>
                        Stopped
                    </span>
                {{ end }}
            </div>
        {{ end }}
    </div>

    <!-- The form submits via HTMX to simulate saving the configuration -->
    <form hx-post="{{ .SaveURL }}" hx-target="#save-result" hx-indicator="#save-spinner" class="space-y-4">
        <div>
            <label for="config-content" class="sr-only">Configuration content</label>
            <textarea id="config-content" name="config" rows="15"
                      class="block w-full rounded-md border-0 py-3 px-4 text-gray-100 shadow-sm ring-1 ring-inset ring-gray-700 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-500 sm:text-sm sm:leading-6 font-mono bg-gray-800">{{ .Config }}</textarea>
        </div>

        <div class="flex items-center gap-4">
            <button type="submit" class="inline-flex items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                <svg id="save-spinner" class="htmx-indicator animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Save Configuration
            </button>
            <div id="save-result" class="text-sm font-medium"></div>
        </div>
    </form>
</div>
{{ end }}

{{ define "save_success" }}
<span class="text-green-600 flex items-center">
    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    Configuration saved (mock)
</span>
{{ end }}
