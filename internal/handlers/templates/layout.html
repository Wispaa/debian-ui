<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Admin Dashboard</title>
    <!-- Tailwind CSS (Play CDN for mockup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex h-screen overflow-hidden">

    <!-- Mobile sidebar backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-gray-900 text-gray-300 transition duration-300 transform -translate-x-full md:relative md:translate-x-0 md:flex flex-col h-full">
        <div class="flex items-center justify-center h-16 bg-gray-900 text-white font-bold text-xl border-b border-gray-800">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mr-2 text-blue-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-18M2.25 9l4.5-1.636M18.75 3l-1.5.545m0 6.205 3 1m1.5.5l-1.5-.5M6.75 7.364V3h-3v18m3-13.636 10.5-3.819" />
            </svg>
            RouterOS
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <div class="px-4 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Main</div>
            <a href="#" hx-get="/page/dashboard" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>

            <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Services Config</div>
            <a href="#" hx-get="/config/sing-box" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="w-5 h-5 mr-3 inline-flex items-center justify-center text-xs bg-gray-800 rounded border border-gray-700">SB</span>
                sing-box
            </a>
            <a href="#" hx-get="/config/amnezia-wg" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="w-5 h-5 mr-3 inline-flex items-center justify-center text-xs bg-gray-800 rounded border border-gray-700">AW</span>
                amnezia-wg
            </a>
            <a href="#" hx-get="/config/wireguard" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="w-5 h-5 mr-3 inline-flex items-center justify-center text-xs bg-gray-800 rounded border border-gray-700">WG</span>
                wireguard
            </a>
            <a href="#" hx-get="/config/openvpn" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="w-5 h-5 mr-3 inline-flex items-center justify-center text-xs bg-gray-800 rounded border border-gray-700">OV</span>
                openvpn
            </a>
            <a href="#" hx-get="/config/dnscrypt-proxy" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="w-5 h-5 mr-3 inline-flex items-center justify-center text-xs bg-gray-800 rounded border border-gray-700">DP</span>
                dnscrypt-proxy
            </a>
            <a href="#" hx-get="/config/firewalld" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <span class="w-5 h-5 mr-3 inline-flex items-center justify-center text-xs bg-gray-800 rounded border border-gray-700">FW</span>
                firewalld
            </a>

            <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Network</div>
            <a href="#" hx-get="/config/interfaces" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Interfaces
            </a>

            <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">System</div>
            <a href="#" hx-get="/page/logs" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Logs
            </a>
            <a href="#" hx-get="/page/system" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                System
            </a>
            <a href="#" hx-get="/page/apt" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                APT
            </a>
            <a href="#" hx-get="/page/terminal" hx-target="#main-content" onclick="toggleSidebar()" class="flex items-center px-6 py-2 hover:bg-gray-800 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Terminal
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="flex items-center justify-between h-16 px-6 bg-white border-b border-gray-200">
            <button onclick="toggleSidebar()" class="text-gray-500 focus:outline-none md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="text-lg font-medium text-gray-800 hidden md:block" id="header-title">Admin Dashboard</div>
            <div class="flex items-center">
                <!-- User profile or other header actions can go here -->
                <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center text-sm font-bold">A</div>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            {{ template "dashboard" . }}
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            // Only toggle if on mobile (md breakpoint is 768px in Tailwind)
            if (window.innerWidth < 768) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }
    </script>
</body>
</html>
